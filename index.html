<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171e2b"><title>Jejak! • A Malaysian Heritage Adventure</title><link rel="stylesheet" href="style.css"></head>
<body><main class="game-shell" aria-label="Heritage adventure game"><div class="stage" id="stage">
<canvas id="world" width="960" height="600" aria-label="Malaysian heritage adventure. Choose answers using the floating buttons or keys 1, 2 and 3."></canvas>
<header class="hud"><div class="location"><b>jejak<span>!</span></b><span id="place-label">MALAYSIA</span></div><div class="tools"><div id="lives" aria-label="5 of 5 lives remaining" role="status">♥ ♥ ♥ ♥ ♥</div><span id="secret-badge" hidden title="Golden Bunga Raya discovered" aria-label="Golden Bunga Raya discovered">✺</span><div id="relics" aria-label="0 of 3 relics collected">◇ <span>0 / 3</span></div><button id="fullscreen" aria-label="Enter fullscreen" title="Fullscreen">⛶</button><button id="pause" aria-label="Pause and settings" title="Pause and settings">Ⅱ</button></div></header>
<section class="question" id="question-panel" hidden aria-label="Current question"><div class="question-meta"><span id="challenge-label"></span><span id="question-count"></span></div><h1 id="question" aria-live="polite"></h1><div class="reveal-bar" aria-hidden="true"><i></i></div><div class="answers" id="answers" hidden aria-label="Answer choices"></div></section>
<p id="secret-announcement" class="sr-only" role="status" aria-live="polite"></p><div class="intro" id="intro"><span class="tag">A MALAYSIAN ADVENTURE</span><h2>Big history.<br>Little explorer.</h2><button class="primary" id="start">Play →</button><small class="secret-hint">Some legends begin with ↑ ↑…</small></div>
<div class="action-row" id="action-row" hidden><p id="status" role="status" aria-live="polite"></p><button class="primary" id="action">Ride →</button></div>
<div class="chase-controls" id="chase-controls" hidden><div><button id="move-left" aria-label="Move left">◀</button><button id="move-right" aria-label="Move right">▶</button><button id="jump" aria-label="Jump">↑</button></div><span>Catch your chosen answer</span><button id="catch" aria-label="Catch nearby spirit">Catch · E</button></div>
<div class="cinema-caption" id="cinema-caption" hidden role="status" aria-live="polite"></div>
<div class="controls" id="controls" hidden><span>← → move · Space jump · E catch / throw</span><span>1 / 2 / 3 choose · Enter confirm</span></div>
<div hidden aria-hidden="true"><span id="eyebrow"></span><span id="title"></span><span id="session"></span><span id="instruction"></span><span id="scene-tip"></span><span id="scene-caption"></span><span id="scene-hud"></span></div>
</div><dialog id="dialog"><div id="dialog-content"></div></dialog></main><noscript>This game needs JavaScript enabled.</noscript><script src="game.js"></script></body></html>
